<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org"
       xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:hover="http://www.w3.org/1999/xhtml"
       layout:decorate="~{owner/layout/LayoutOwner}" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<main layout:fragment="main"  class="ml-64 mt-16 p-10 min-h-[calc(100vh-4rem)]">
    <!-- Content Canvas -->
    <div class="pt-24 px-8 pb-12 max-w-[1320px] mx-auto">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">
            <a th:href="@{/service/add}" class="bg-primary text-white font-bold px-7 py-3.5 rounded-2xl shadow-lg shadow-primary/20 hover:shadow-primary/40 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center gap-2.5">
                <span class="material-symbols-outlined text-lg">add_business</span>
                <span>New Service</span>
            </a>
        </div>
        <!-- Management Section -->
        <div class="bg-white rounded-2xl border border-outline-variant custom-shadow overflow-hidden">
            <div class="p-6 border-b border-outline-variant flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="relative w-full sm:w-64">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">location_on</span>
                    <select class="w-full pl-10 pr-4 py-2.5 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary focus:outline-none font-montserrat font-semibold text-[14px] text-on-surface appearance-none transition-all">
                        <option value="">Chọn cơ sở...</option>

                    </select>
                    <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
                </div><div class="relative w-full sm:w-96">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
                <input class="w-full pl-10 pr-4 py-2.5 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary focus:outline-none font-body-md transition-all" placeholder="Tìm kiếm dịch vụ..." type="text">
            </div>
                <div class="flex gap-3 w-full sm:w-auto">
                    <button class="flex-1 sm:flex-none bg-white border border-outline-variant px-5 py-2.5 rounded-xl font-label-md text-on-surface-variant flex items-center justify-center gap-2 hover:bg-surface-container transition-colors">
                        <span class="material-symbols-outlined !text-[20px]">filter_list</span>
                        Lọc
                    </button>
                    <button class="flex-1 sm:flex-none bg-white border border-outline-variant px-5 py-2.5 rounded-xl font-label-md text-on-surface-variant flex items-center justify-center gap-2 hover:bg-surface-container transition-colors">
                        <span class="material-symbols-outlined !text-[20px]">download</span>
                        Xuất Excel
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                    <tr class="text-left bg-surface-container-low border-b border-outline-variant">
                        <th class="px-6 py-4 font-montserrat text-[13px] font-bold uppercase tracking-wider text-on-surface-variant">Tên dịch vụ</th>
                        <th class="px-6 py-4 font-montserrat text-[13px] font-bold uppercase tracking-wider text-on-surface-variant">Mô tả</th>
                        <th class="px-6 py-4 font-montserrat text-[13px] font-bold uppercase tracking-wider text-on-surface-variant">Đơn giá</th>
                        <th class="px-6 py-4 font-montserrat text-[13px] font-bold uppercase tracking-wider text-on-surface-variant">Đơn vị</th>
                        <th class="px-6 py-4 font-montserrat text-[13px] font-bold uppercase tracking-wider text-on-surface-variant text-right">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-outline-variant/30">
                    <!-- Racket Rental -->
                    <tr class="hover:bg-surface-container-low/50 transition-colors">
                        <td class="px-6 py-5">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
                                    <span class="material-symbols-outlined">sports_tennis</span>
                                </div>
                                <span class="font-montserrat font-semibold text-on-surface">Thuê vợt Tennis</span>
                            </div>
                        </td>
                        <td class="px-6 py-5 font-body-md text-on-surface-variant text-[14px]">Yonex Nanoflare Series - Professional Quality</td>
                        <td class="px-6 py-5 font-montserrat font-bold text-on-surface">$5.00</td>
                        <td class="px-6 py-5 font-body-md text-on-surface-variant">Giờ / Cái</td>
                        <td class="px-6 py-5 text-right">
                            <div class="flex justify-end gap-2">
                                <button class="p-2 text-on-surface-variant hover:text-primary hover:bg-primary/5 rounded-lg transition-all" onclick="toggleModal()" title="Chỉnh sửa">
                                    <span class="material-symbols-outlined !text-[20px]">edit</span>
                                </button>
                                <button class="p-2 text-on-surface-variant hover:text-error hover:bg-error/5 rounded-lg transition-all" title="Xóa">
                                    <span class="material-symbols-outlined !text-[20px]">delete</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <!-- Bottled Water -->

                    </tbody>
                </table>
            </div>
            <div class="p-4 border-t border-outline-variant/30 flex items-center justify-between bg-surface-container-low">
                <p class="font-body-md text-[14px] text-on-surface-variant">Hiển thị 1-4 trong 12 dịch vụ</p>
                <div class="flex gap-2">
                    <button class="h-8 w-8 flex items-center justify-center rounded-lg border border-outline-variant bg-white text-on-surface-variant hover:bg-surface-container transition-colors disabled:opacity-50" disabled="">
                        <span class="material-symbols-outlined !text-[18px]">chevron_left</span>
                    </button>
                    <button class="h-8 w-8 flex items-center justify-center rounded-lg bg-primary text-on-primary font-bold text-[13px]">1</button>
                    <button class="h-8 w-8 flex items-center justify-center rounded-lg border border-outline-variant bg-white text-on-surface-variant hover:bg-surface-container transition-colors font-bold text-[13px]">2</button>
                    <button class="h-8 w-8 flex items-center justify-center rounded-lg border border-outline-variant bg-white text-on-surface-variant hover:bg-surface-container transition-colors font-bold text-[13px]">3</button>
                    <button class="h-8 w-8 flex items-center justify-center rounded-lg border border-outline-variant bg-white text-on-surface-variant hover:bg-surface-container transition-colors">
                        <span class="material-symbols-outlined !text-[18px]">chevron_right</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
