<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"  layout:decorate="~{owner/layout/LayoutOwner}" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<main layout:fragment="main" class="ml-64  mt-16 p-10 min-h-[calc(100vh-4rem)]">
  <!-- CONTENT CANVAS -->
  <div class="p-10 max-w-[1400px] mx-auto">
    <!-- PAGE HEADER & CONTROLS -->
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-8 mb-10">
      <div>
        <h3 class="font-headline-lg text-[2.75rem] font-black text-on-surface tracking-tight leading-none mb-3">Court Schedule</h3>
        <p class="text-on-surface-variant/70 font-medium text-lg">Real-time availability and booking management for Arena 1.</p>
      </div>
      <div class="relative space-y-2 w-full lg:w-[320px]">

    <span class="absolute left-3 top-1/2 -translate-y-1/2
                 material-symbols-outlined
                 text-on-surface-variant text-xl pointer-events-none">
        location_on
    </span>


        <select id="schedule-facility"
                class="w-full h-12
                   pl-10 pr-4
                   rounded-xl
                   border border-outline-variant
                   bg-white
                   text-on-surface
                   font-medium
                   appearance-none
                   focus:outline-none
                   focus:ring-2
                   focus:ring-primary
                   focus:border-primary
                   transition-all">

          <option value="">
            -- Chọn cơ sở --
          </option>

          <option th:each="facility : ${facilities}"
                  th:value="${facility.id}"
                  th:text="${facility.name_facility}"
          >
          </option>

        </select>



      </div>
      <div class="flex flex-wrap items-center gap-4">
        <!-- ACTION BUTTONS -->
        <div class="flex items-center gap-3 p-1.5 bg-white border border-outline-variant/30 rounded-2xl shadow-sm">
          <a th:href="@{/schedule/add}" class="bg-primary text-on-primary px-5 py-3 rounded-xl font-headline-md text-xs font-black uppercase tracking-wider hover:opacity-90 hover:shadow-lg hover:shadow-primary/20 transition-all flex items-center gap-2">
            <span class="material-symbols-outlined text-lg">add_circle</span>
            Tạo lịch sân
          </a>
        </div>
        <!-- DATE NAV -->
      </div>
    </div>
    <!-- LEGEND & STATS -->
    <div class="flex flex-wrap items-center justify-between gap-6 mb-8 px-2">
      <div class="flex items-center gap-8">
        <div class="flex items-center gap-3">
          <span class="w-5 h-5 rounded-lg bg-primary shadow-sm shadow-primary/20"></span>
          <span class="text-xs font-black text-on-surface font-headline-md uppercase tracking-wider">Booked</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="w-5 h-5 rounded-lg bg-emerald-500 shadow-sm shadow-emerald-500/20"></span>
          <span class="text-xs font-black text-on-surface font-headline-md uppercase tracking-wider">Available</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="w-5 h-5 rounded-lg bg-slate-400 shadow-sm shadow-slate-400/20"></span>
          <span class="text-xs font-black text-on-surface font-headline-md uppercase tracking-wider">Maintenance</span>
        </div>
      </div>
      <div class="flex items-center gap-6 text-[11px] font-black uppercase tracking-widest text-on-surface-variant bg-white px-6 py-4 rounded-2xl border border-outline-variant/20 shadow-sm">
        <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 12 Slots Free</span>
        <span class="w-px h-4 bg-outline-variant/30"></span>
        <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-primary"></span> 8 Booked</span>
        <span class="w-px h-4 bg-outline-variant/30"></span>
        <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span> 2 Maintenance</span>
      </div>
    </div>
    <!-- SCHEDULE GRID CONTAINER -->
    <div class="bg-white rounded-[2.5rem] border border-outline-variant/20 shadow-[0_30px_100px_rgba(0,0,0,0.06)] overflow-hidden flex flex-col h-[780px]">
      <!-- GRID HEADER -->
      <div class="schedule-grid bg-white border-b border-outline-variant/20 z-10">
        <div class="p-6 border-r border-outline-variant/10 flex items-center justify-center bg-surface-container-lowest">
          <span class="material-symbols-outlined text-primary/40 text-2xl">schedule</span>
        </div>
        <div id="courtHeader"  class="contents">

        </div>


      </div>
      <!-- SCROLLABLE GRID BODY -->
      <div class="flex-1 overflow-y-auto custom-scrollbar relative">
        <div class="schedule-grid min-h-full"  style="grid-auto-rows:90px;">
          <!-- TIME LABELS (Y-AXIS) -->
          <div class="col-start-1 row-start-1 row-span-full border-r border-outline-variant/10 bg-surface-container-lowest/50">
            <div th:each="time : ${time}" class="h-[90px] flex items-center justify-center text-[12px] font-black text-on-surface-variant/40 border-b border-outline-variant/5">
              <span th:text="${time}"></span>
            </div>

          </div>
          <!-- SLOTS -->
            <!-- SLOTS -->
            <div id="scheduleBody" class="contents"></div>

          <!-- BACKGROUND LINES (FOR EMPTY SPACE) -->
          <div class="col-start-2 row-start-6 row-span-12 border-r border-outline-variant/5 bg-[linear-gradient(rgba(0,0,0,0.02)_1px,transparent_1px)] bg-[size:100%_90px]"></div>
          <div class="col-start-3 row-start-5 row-span-13 border-r border-outline-variant/5 bg-[linear-gradient(rgba(0,0,0,0.02)_1px,transparent_1px)] bg-[size:100%_90px]"></div>
          <div class="col-start-4 row-start-8 row-span-10 border-r border-outline-variant/5 bg-[linear-gradient(rgba(0,0,0,0.02)_1px,transparent_1px)] bg-[size:100%_90px]"></div>
          <div class="col-start-5 row-start-1 row-span-17 border-outline-variant/5 bg-[linear-gradient(rgba(0,0,0,0.02)_1px,transparent_1px)] bg-[size:100%_90px]"></div>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
