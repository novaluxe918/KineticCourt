<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"  layout:decorate="~{owner/layout/LayoutOwner}" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<main layout:fragment="main" class="ml-64  mt-16 p-10 min-h-[calc(100vh-4rem)]">
  <!-- CONTENT CANVAS -->
  <div class="p-10 max-w-[1400px] mx-auto">
    <!-- PAGE HEADER & CONTROLS -->
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-8 mb-10">
      <div>
        <h3 class="font-headline-lg text-[2.75rem] font-black text-on-surface tracking-tight leading-none mb-3">Court Schedule</h3>
        <p class="text-on-surface-variant/70 font-medium text-lg">Real-time availability and booking management for Arena 1.</p>
      </div>
      <div class="relative space-y-2 w-full lg:w-[320px]">

    <span class="absolute left-3 top-1/2 -translate-y-1/2
                 material-symbols-outlined
                 text-on-surface-variant text-xl pointer-events-none">
        location_on
    </span>

        <form method="get"
              th:action="@{/schedule/schedule_owner}">
          <select name="facilityId"
                  onchange="this.form.submit()"
                  class="w-full h-12
                   pl-10 pr-4
                   rounded-xl
                   border border-outline-variant
                   bg-white
                   text-on-surface
                   font-medium
                   appearance-none
                   focus:outline-none
                   focus:ring-2
                   focus:ring-primary
                   focus:border-primary
                   transition-all">

            <option value="">
              -- Chọn cơ sở --
            </option>

            <option th:each="facility : ${facilities}"
                    th:value="${facility.id}"
                    th:text="${facility.name_facility}"
                    th:selected="${facility.id == selectFacility}"
            >
            </option>

          </select>
        </form>




      </div>
      <div class="flex flex-wrap items-center gap-4">
        <!-- ACTION BUTTONS -->
        <div class="flex items-center gap-3 p-1.5 bg-white border border-outline-variant/30 rounded-2xl shadow-sm">
          <a th:href="@{/schedule/add}" class="bg-primary text-on-primary px-5 py-3 rounded-xl font-headline-md text-xs font-black uppercase tracking-wider hover:opacity-90 hover:shadow-lg hover:shadow-primary/20 transition-all flex items-center gap-2">
            <span class="material-symbols-outlined text-lg">add_circle</span>
            Tạo lịch sân
          </a>
        </div>
        <!-- DATE NAV -->
      </div>
    </div>
    <!-- SCHEDULE GRID CONTAINER -->
    <div class="bg-white rounded-3xl border border-outline-variant/20 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
          <tr class="bg-surface-container-low border-b border-outline-variant/20">
            <th class="px-6 py-4 font-headline-md text-xs font-black uppercase tracking-widest text-on-surface-variant/60">Court Name</th>
            <th class="px-6 py-4 font-headline-md text-xs font-black uppercase tracking-widest text-on-surface-variant/60">Time Range</th>
            <th class="px-6 py-4 font-headline-md text-xs font-black uppercase tracking-widest text-on-surface-variant/60">Date</th>
            <th class="px-6 py-4 font-headline-md text-xs font-black uppercase tracking-widest text-on-surface-variant/60">Price</th>
            <th class="px-6 py-4 font-headline-md text-xs font-black uppercase tracking-widest text-on-surface-variant/60">Status</th>
            <th class="px-6 py-4 font-headline-md text-xs font-black uppercase tracking-widest text-on-surface-variant/60 text-right">Actions</th>
          </tr>
          </thead>
          <tbody class="divide-y divide-outline-variant/10">
          <tr th:each="schedule : ${schedules}" class="hover:bg-surface-container-lowest transition-colors">
            <td class="px-6 py-5">
              <div class="flex flex-col">
                <span th:text="${schedule.schedule.court.name_court}" class="font-headline-md text-sm font-black text-on-surface"></span>
              </div>
            </td>
            <td class="px-6 py-5">
              <div class="flex items-center gap-2 text-on-surface font-medium">
                <span class="material-symbols-outlined text-primary text-lg">schedule</span>
                <span th:text="${schedule.time_start}" class="text-sm"></span> - <span th:text="${schedule.time_end}" class="text-sm"></span>
              </div>
            </td>
            <td th:text="${schedule.schedule.date_start}" class="px-6 py-5 text-sm text-on-surface-variant font-medium"></td>
            <td th:text="${schedule.price}" class="px-6 py-5 text-sm font-black text-on-surface"></td>
            <td class="px-6 py-5">
              <span th:text="${schedule.status}" class="inline-flex items-center px-3 py-1 rounded-lg text-[10px] font-black bg-primary/10 text-primary uppercase tracking-wider"></span>
            </td>
            <td class="px-6 py-5">
              <div class="flex items-center justify-end gap-2">
                <a th:href="@{/schedule/edit/{id}(id=${schedule.schedule.id})}" class="p-2 text-on-surface-variant/60 hover:text-primary hover:bg-primary/5 rounded-lg transition-all" title="Sửa"><span class="material-symbols-outlined text-xl">edit</span></a>
                <a th:href="@{/schedule/delete/{id}(id=${schedule.schedule.id})}" class="p-2 text-on-surface-variant/60 hover:text-error hover:bg-error/5 rounded-lg transition-all" title="Xóa"><span class="material-symbols-outlined text-xl">delete_outline</span></a>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="flex justify-center gap-2 mt-8">

        <!-- Previous -->
        <a th:if="${schedule.hasPrevious()}"
           th:href="@{/schedule/schedule_owner(
           page=${schedule.number - 1},
           size=${schedule.size},
           facilityId=${selectedFacility}
       )}"
           class="h-8 w-8 flex items-center justify-center rounded-lg
              border border-outline-variant bg-white
              text-on-surface-variant
              hover:bg-surface-container transition-colors">

        <span class="material-symbols-outlined !text-[18px]">
            chevron_left
        </span>
        </a>


        <!-- Số trang -->
        <th:block th:if="${schedule.totalPages > 0}">

          <a th:each="i : ${#numbers.sequence(0, schedule.totalPages - 1)}"
             th:href="@{/schedule/schedule_owner(
               page=${i},
               size=${schedule.size},
               facilityId=${selectedFacility}
           )}"
             th:text="${i + 1}"
             th:class="${i == schedule.number}
               ? 'h-8 w-8 flex items-center justify-center rounded-lg bg-primary text-on-primary font-bold text-[13px]'
               : 'h-8 w-8 flex items-center justify-center rounded-lg border border-outline-variant bg-white text-on-surface-variant hover:bg-surface-container transition-colors'">
          </a>

        </th:block>


        <!-- Next -->
        <a th:if="${schedule.hasNext()}"
           th:href="@{/schedule/schedule_owner(
           page=${schedule.number + 1},
           size=${schedule.size},
           facilityId=${selectedFacility}
       )}"
           class="h-8 w-8 flex items-center justify-center rounded-lg
              border border-outline-variant bg-white
              text-on-surface-variant
              hover:bg-surface-container transition-colors">

        <span class="material-symbols-outlined !text-[18px]">
            chevron_right
        </span>
        </a>

      </div>
    </div>
  </div>
</main>

</body>
</html>
