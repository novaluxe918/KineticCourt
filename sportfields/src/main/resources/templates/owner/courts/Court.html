<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:hover="http://www.w3.org/1999/xhtml"
      layout:decorate="~{owner/layout/LayoutOwner}" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<body>
<main layout:fragment="main" class="ml-64 mt-16 p-10 min-h-[calc(100vh-4rem)]">
    <div class="max-w-[1320px] mx-auto">
        <!-- Facility Selection Header -->
        <div class="flex flex-col lg:flex-row justify-between gap-6 mb-10">

            <!-- LEFT CONTENT -->
            <div class="flex-1">

                <h2 class="text-2xl font-bold text-on-surface mb-2">
                    Court Management
                </h2>

                <p class="text-on-surface-variant mb-6">
                    Choose a facility to manage its courts and view performance insights.
                </p>


                <!-- FACILITY SELECT -->
                <label class="text-on-surface-variant font-label-md uppercase tracking-wider opacity-60 mb-2 block">
                    Select Facility
                </label>

                <div class="relative max-w-lg">

                    <div class="flex items-center gap-3
                        bg-white
                        border border-outline-variant
                        rounded-xl
                        px-5 py-3
                        hover:border-primary
                        transition-all
                        shadow-sm">

                <span class="material-symbols-outlined text-primary text-2xl">
                    location_on
                </span>


                        <select id="facilitySelect"
                                class="w-full bg-transparent border-none outline-none focus:ring-0 cursor-pointer">

                            <option value="">
                                -- Chọn cơ sở --
                            </option>

                            <option th:each="facility : ${facilities}"
                                    th:value="${facility.id}"
                                    th:text="${facility.name_facility}"
                                    th:selected="${facility.id == selectedFacility}">
                            </option>

                        </select>

                    </div>

                </div>

            </div>



            <!-- RIGHT ACTION AREA -->
            <div class="flex flex-col sm:flex-row lg:flex-col xl:flex-row
                items-start lg:items-end xl:items-center
                gap-4">


                <!-- NEW COURT BUTTON -->
                <a th:href="@{/court/add}"
                   class="
           bg-primary
           text-white
           font-bold
           px-7
           py-3.5
           rounded-2xl
           shadow-lg
           shadow-primary/20
           hover:shadow-primary/40
           hover:-translate-y-0.5
           transition-all
           flex
           items-center
           gap-2.5">

            <span class="material-symbols-outlined text-lg">
                add_business
            </span>

                    <span>
                New Court
            </span>

                </a>



                <!-- FILTER -->
                <div class="
            flex
            items-center
            gap-3
            bg-surface-container-lowest
            px-4
            py-2
            rounded-xl
            border
            border-outline-variant
            premium-shadow">

            <span class="
                text-xs
                font-bold
                text-on-surface-variant
                uppercase
                tracking-tighter">

                Filter

            </span>


                    <div class="h-6 w-px bg-outline-variant"></div>


                    <select
                            class="
                bg-transparent
                border-none
                py-1.5
                pl-2
                pr-8
                text-sm
                font-bold
                focus:ring-0
                cursor-pointer
                text-primary">


                        <option>
                            All Courts
                        </option>

                        <option>
                            Available Only
                        </option>

                        <option>
                            In Use
                        </option>

                        <option>
                            Maintenance Only
                        </option>

                    </select>


                </div>


            </div>


        </div>
        <!-- Bento Grid of Courts -->
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-2 gap-6 items-stretch ">
            <!-- Court Card 01 - Available -->
            <div th:each="c : ${courts.content}" class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-4 court-card-hover flex flex-col h-[220px] premium-shadow">
                <div class="flex justify-between items-start mb-3">
                    <div   class="flex flex-col">
                        <h3 th:text="${c.name_court}" class="font-headline-md text-headline-md font-bold tracking-tight"></h3>
                    </div>
                    <span th:text="${c.status}" class="px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 text-[11px] font-bold flex items-center gap-1.5 border border-emerald-100 uppercase tracking-wider">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span>
                    </span>
                </div>
                <div class="flex justify-between items-center mt-auto pt-4 border-t border-outline-variant/30">

                    <div class="flex gap-2">
                        <a th:href="@{/court/edit/{id}(id=${c.id})}" class="w-10 h-10 border border-outline-variant rounded-xl hover:bg-surface-container transition-all flex items-center justify-center text-on-surface-variant hover:text-primary" title="Edit Rate">
                            <span class="material-symbols-outlined text-lg">edit_note</span>
                        </a>
                        <a th:href="@{/court/maintenance/{id}(id=${c.id})}"
                           class="w-10 h-10 border border-outline-variant rounded-xl hover:bg-error-container hover:text-error transition-all flex items-center justify-center text-on-surface-variant"
                           title="Maintenance Mode"
                        onclick="return confirm('Đưa sân vào chế độ bảo trì?')"
                         th:classappend="${c.status.name() == 'AVAILABLE'} ? 'bg-emerald-50 text-emerald-700 border-emerald-100' :
                            (${c.status.name() == 'BOOKED'} ? ' bg-red-50 text-red-700 border-red-100' :  ' bg-amber-50 text-amber-700 border-amber-100' )">
                            <span class="material-symbols-outlined text-lg">build</span>
                        </a>

                        <a th:href="@{/court/delete/{id}(id=${c.id})}"
                           class="w-10 h-10 border border-outline-variant rounded-xl hover:bg-surface-container transition-all flex items-center justify-center text-on-surface-variant hover:text-primary"
                           title="Delete">

    <span class="material-symbols-outlined">
        delete
    </span>
                        </a>
                    </div>
                </div>

            </div>

        </div>

        <div class="p-4 border-t border-outline-variant/30 flex items-center justify-between bg-surface-container-low">

            <div class="flex gap-2">

                <!-- Previous -->
                <a th:if="${courts.hasPrevious()}"
                   th:href="@{/court/court_owner(
               page=${courts.number - 1},
               size=${courts.size},
               facilityId=${selectedFacility}
           )}"
                   class="h-8 w-8 flex items-center justify-center rounded-lg
                  border border-outline-variant bg-white
                  text-on-surface-variant
                  hover:bg-surface-container transition-colors">

            <span class="material-symbols-outlined !text-[18px]">
                chevron_left
            </span>
                </a>


                <!-- Các số trang -->
                <th:block th:if="${courts.totalPages > 0}">

                    <a th:each="i : ${#numbers.sequence(0, courts.totalPages - 1)}"
                       th:href="@{/court/court_owner(
                   page=${i},
                   size=${courts.size},
                   facilityId=${selectedFacility}
               )}"
                       th:text="${i + 1}"
                       th:class="${i == courts.number}
                   ? 'h-8 w-8 flex items-center justify-center rounded-lg bg-primary text-on-primary font-bold text-[13px]'
                   : 'h-8 w-8 flex items-center justify-center rounded-lg border border-outline-variant bg-white text-on-surface-variant hover:bg-surface-container transition-colors'">
                    </a>

                </th:block>


                <!-- Next -->
                <a th:if="${courts.hasNext()}"
                   th:href="@{/court/court_owner(
               page=${courts.number + 1},
               size=${courts.size},
               facilityId=${selectedFacility}
           )}"
                   class="h-8 w-8 flex items-center justify-center rounded-lg
                  border border-outline-variant bg-white
                  text-on-surface-variant
                  hover:bg-surface-container transition-colors">

            <span class="material-symbols-outlined !text-[18px]">
                chevron_right
            </span>
                </a>

            </div>

        </div>

    </div>


</main>
</body>

</html>
