<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{owner/layout/LayoutOwner}" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<body>
<main layout:fragment="main" class="ml-64 mt-16 p-10 min-h-[calc(100vh-4rem)]">
    <div class="max-w-[1320px] mx-auto">
        <!-- Facility Selection Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 gap-6">
            <div class="flex-1">
                <label class="text-on-surface-variant font-label-md text-label-md uppercase tracking-wider opacity-60 mb-2 block">Select Facility</label>
                <div class="relative group max-w-md">
                    <div class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant rounded-xl px-5 py-3 cursor-pointer hover:border-primary transition-all premium-shadow">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-primary">location_on</span>

                            <select id="facilitySelect" class="font-headline-md text-headline-md font-bold text-on-surface bg-transparent outline-none">
                                <option value="">-- Chọn cơ sở --</option>
                                <option th:each="facility : ${facilities}"
                                        th:value="${facility.id}"
                                        th:text="${facility.name_facility}"
                                        th:selected="${facility.id == selectedFacility }"
                                ></option>

                            </select>
                        </div>

                        <span class="material-symbols-outlined text-on-surface-variant">
    expand_more
</span>
                    </div>
                </div>
                <p class="text-on-surface-variant body-md mt-3">Choose a facility to manage its courts and view performance insights.</p>
            </div>
            <div class="flex items-center gap-3 bg-surface-container-lowest p-1.5 rounded-xl border border-outline-variant premium-shadow">
                <span class="text-xs font-bold px-3 text-on-surface-variant uppercase tracking-tighter">Filter by</span>
                <div class="h-6 w-px bg-outline-variant"></div>
                <select class="bg-transparent border-none py-1.5 pl-3 pr-8 text-sm font-bold focus:ring-0 cursor-pointer text-primary">
                    <option>All Courts</option>
                    <option>Available Only</option>
                    <option>In Use</option>
                    <option>Maintenance Only</option>
                </select>
            </div>
        </div>
        <!-- Bento Grid of Courts -->
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-2 gap-6 items-start ">
            <!-- Court Card 01 - Available -->
            <div th:each="c: ${court}" class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-6 court-card-hover flex flex-col h-full premium-shadow">
                <div class="flex justify-between items-start mb-3">
                    <div   class="flex flex-col">
                        <h3 th:text="${c.name_court}" class="font-headline-md text-headline-md font-bold tracking-tight"></h3>
                    </div>
                    <span th:text="${c.status}" class="px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 text-[11px] font-bold flex items-center gap-1.5 border border-emerald-100 uppercase tracking-wider">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span>
                    </span>
                </div>
                <div class="flex justify-between items-center mt-auto pt-4 border-t border-outline-variant/30">

                    <div class="flex gap-2">
                        <button class="w-10 h-10 border border-outline-variant rounded-xl hover:bg-surface-container transition-all flex items-center justify-center text-on-surface-variant hover:text-primary" title="Edit Rate">
                            <span class="material-symbols-outlined text-lg">edit_note</span>
                        </button>
                        <button class="w-10 h-10 border border-outline-variant rounded-xl hover:bg-error-container hover:text-error transition-all flex items-center justify-center text-on-surface-variant" title="Maintenance Mode">
                            <span class="material-symbols-outlined text-lg">build</span>
                        </button>
                    </div>
                </div>
            </div>
            <!-- Add New Court Placeholder -->
            <div class="border-2 border-dashed border-primary/20 rounded-2xl p-8 flex flex-col items-center justify-center min-h-[420px] bg-white/40 hover:bg-primary/5 hover:border-primary/40 transition-all duration-300 cursor-pointer group premium-shadow">
                <div class="w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center mb-6 group-hover:scale-110 transition-all duration-500 shadow-inner">
                    <a th:href="@{/court/add}"><span class="material-symbols-outlined text-primary text-4xl group-hover:rotate-90 transition-transform duration-500">add_circle</span></a>
                </div>
                <h3 class="font-headline-md text-headline-md font-bold text-on-surface text-center">Add New Court</h3>
                <p class="text-on-surface-variant body-md text-center max-w-[240px] mt-3 leading-relaxed opacity-80">Easily expand your facility capacity and manage bookings in real-time.</p>
                <div class="mt-8 px-6 py-2.5 bg-primary-fixed-dim text-primary rounded-full font-bold text-sm group-hover:bg-primary group-hover:text-on-primary transition-all shadow-sm">
                    Register Facility
                </div>
            </div>
        </div>

    </div>


</main>
</body>

</html>
