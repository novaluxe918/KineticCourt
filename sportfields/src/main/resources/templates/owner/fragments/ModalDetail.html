<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:fragment="detailModal" id="detailModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8 hidden">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-on-background/40 backdrop-blur-sm"></div>
  <!-- Modal Card -->
  <div class="relative bg-white w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-[2rem] shadow-2xl flex flex-col">
    <!-- Header -->
    <div class="sticky top-0 bg-white/95 backdrop-blur px-8 py-6 border-b border-outline-variant/30 flex items-center justify-between z-10">
      <div class="flex items-center gap-4">
        <h3 id="facilityName" class="font-headline-md text-2xl font-bold text-on-surface"></h3>
        <span class="bg-green-50 text-green-700 px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-widest flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> Active
        </span>
      </div>
      <button onclick="closeDetailModal()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <!-- Content -->
    <div class="p-8">
      <!-- Hero Image -->
      <div class="w-full h-64 rounded-3xl overflow-hidden mb-8">
        <img alt="Smash Central Elite" class="w-full h-full object-cover" id="facilityImage"/>
      </div>
      <!-- Info Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10">
        <div class="md:col-span-2 space-y-6">
          <div>
            <h4 class="font-label-md text-xs text-on-surface-variant uppercase tracking-widest mb-3">Facility Information</h4>
            <div class="space-y-4">
              <div class="flex items-start gap-3">
                <span class="material-symbols-outlined text-primary">location_on</span>
                <div>
                  <p class="text-sm font-bold text-on-surface">Full Address</p>
                  <p id="facilityAddress" class="text-sm text-on-surface-variant"></p>
                </div>
              </div>
              <div class="flex items-start gap-3">
                <span class="material-symbols-outlined text-primary">call</span>
                <div>
                  <p class="text-sm font-bold text-on-surface">Phone Number</p>
                  <p id="facilityPhone" class="text-sm text-on-surface-variant"></p>
                </div>
              </div>
              <div class="flex items-start gap-3">
                <span class="material-symbols-outlined text-primary">map</span>
                <div>
                  <p class="text-sm font-bold text-on-surface">Ward / Sub-district</p>
                  <p id="facilityWard" class="text-sm text-on-surface-variant"></p>
                </div>
              </div>
            </div>
          </div>
          <div>
            <h4 class="font-label-md text-xs text-on-surface-variant uppercase tracking-widest mb-3">Description</h4>
            <p id="facilityDescription" class="text-sm text-on-surface-variant leading-relaxed">
            </p>
          </div>
        </div>
        <!-- Metrics Sidebar -->
        <div class="space-y-4">
          <h4 class="font-label-md text-xs text-on-surface-variant uppercase tracking-widest mb-3">Key Metrics</h4>
          <div class="bg-surface-container-low p-5 rounded-2xl border border-outline-variant/30">
            <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-1">Total Courts</p>
            <p class="text-2xl font-extrabold text-primary">12</p>
          </div>
          <div class="bg-surface-container-low p-5 rounded-2xl border border-outline-variant/30">
            <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-1">Rating</p>
            <div class="flex items-center gap-2">
              <p class="text-2xl font-extrabold text-on-surface">4.9</p>
              <div class="flex text-primary">
                <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
                <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
                <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
                <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
                <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star_half</span>
              </div>
            </div>
          </div>
          <div class="bg-surface-container-low p-5 rounded-2xl border border-outline-variant/30">
            <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-1">Today's Bookings</p>
            <p class="text-2xl font-extrabold text-on-surface">48</p>
          </div>
        </div>
      </div>
    </div>
    <!-- Footer -->
    <div class="p-8 border-t border-outline-variant/30 flex items-center justify-end gap-4 bg-surface-container-lowest">
      <button onclick="closeDetailModal()" class="px-8 py-3.5 bg-surface-container-low text-on-surface font-bold rounded-xl hover:bg-surface-container transition-all">
        Close
      </button>
      <button class="px-8 py-3.5 bg-primary-container text-on-primary-container font-bold rounded-xl shadow-lg shadow-primary/20 hover:shadow-primary/40 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center gap-2">
        <span class="material-symbols-outlined text-lg">edit</span>
        Edit Facility
      </button>
    </div>
  </div>
</div>
</body>
</html>
