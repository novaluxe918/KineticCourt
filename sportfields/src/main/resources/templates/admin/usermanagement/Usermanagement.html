<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/LayoutAdmin}" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<main layout:fragment="content" class="ml-64 p-gutter max-w-container-max">
    <!-- Header Section -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-8">
        <div>
            <h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">User Management</h2>
            <nav class="flex text-label-md text-on-surface-variant gap-2">
                <a class="hover:text-primary" href="#">Dashboard</a>
                <span class="">/</span>
                <span class="text-primary font-bold">Users</span>
            </nav>
        </div>
    </div>
    <!-- Filters & Stats Bento -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <!-- Stat Cards -->
        <div class="md:col-span-1 bg-white p-6 rounded-xl border border-outline-variant flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
            </div>
            <div>
                <p class="text-label-md text-on-surface-variant">Total Users</p>
                <p class="font-headline-md text-headline-md">1,284</p>
            </div>
        </div>
        <div class="md:col-span-1 bg-white p-6 rounded-xl border border-outline-variant flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-secondary-container/50 flex items-center justify-center text-secondary">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">verified_user</span>
            </div>
            <div>
                <p class="text-label-md text-on-surface-variant">Active Now</p>
                <p class="font-headline-md text-headline-md">42</p>
            </div>
        </div>
        <!-- Filter Controls -->
        <div class="md:col-span-2 bg-white p-6 rounded-xl border border-outline-variant flex items-center gap-4">
            <div class="flex-1 grid grid-cols-2 gap-4">
                <select class="bg-surface-container-low border-outline-variant rounded-lg text-body-md py-2 focus:ring-primary focus:border-primary">
                    <option value="">All Roles</option>
                    <option value="admin">Admin</option>
                    <option value="customer">Customer</option>
                </select>
                <select class="bg-surface-container-low border-outline-variant rounded-lg text-body-md py-2 focus:ring-primary focus:border-primary">
                    <option value="">Joined Date</option>
                    <option value="today">Today</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                </select>
            </div>
            <button class="bg-surface-container-high p-2 rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-colors">
                <span class="material-symbols-outlined">filter_list</span>
            </button>
        </div>
    </div>
    <!-- User Table Section -->
    <div class="bg-white rounded-xl border border-outline-variant shadow-sm overflow-hidden">
        <div class="user-table-container overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-surface-container-low border-b border-outline-variant">
                    <th class="px-6 py-4 font-label-md text-on-surface-variant uppercase tracking-wider">User</th>
                    <th class="px-6 py-4 font-label-md text-on-surface-variant uppercase tracking-wider">Email</th>
                    <th class="px-6 py-4 font-label-md text-on-surface-variant uppercase tracking-wider">Role</th>
                    <th class="px-6 py-4 font-label-md text-on-surface-variant uppercase tracking-wider text-right">Actions</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-outline-variant">
                <!-- Table Row 1 -->
                <tr th:each="user : ${users}" class="hover:bg-surface-container-low/50 transition-colors" style="transition: transform 0.2s ease-out; transform: translateX(0px);">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <span th:text="${user.full_name}" class="font-body-md font-semibold text-on-surface">Alex Thompson</span>
                        </div>
                    </td>
                    <td th:text="${user.email}" class="px-6 py-4 text-body-md text-on-surface-variant"></td>
                    <td class="px-6 py-4">
                        <span th:text="${user.role}" class="px-3 py-1 rounded-full text-[12px] font-bold uppercase tracking-tight bg-secondary-container text-on-secondary-container"></span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-2"><button class="p-2 hover:bg-surface-container-high rounded-lg text-on-surface-variant"><span class="material-symbols-outlined text-[20px]">lock</span></button></div>
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
        <!-- Table Footer / Pagination -->
        <div class="px-6 py-4 bg-surface-container-low border-t border-outline-variant flex items-center justify-between">
            <p class="text-label-md text-on-surface-variant">Showing 1 to 5 of 1,284 users</p>
            <div class="flex items-center gap-2">
                <button class="px-3 py-1 rounded border border-outline-variant text-on-surface-variant hover:bg-white transition-colors disabled:opacity-50" disabled="">Previous</button>
                <button class="px-3 py-1 rounded bg-primary text-white font-bold">1</button>
                <button class="px-3 py-1 rounded hover:bg-white text-on-surface-variant transition-colors">2</button>
                <button class="px-3 py-1 rounded hover:bg-white text-on-surface-variant transition-colors">3</button>
                <span class="px-2">...</span>
                <button class="px-3 py-1 rounded hover:bg-white text-on-surface-variant transition-colors">257</button>
                <button class="px-3 py-1 rounded border border-outline-variant text-on-surface-variant hover:bg-white transition-colors">Next</button>
            </div>
        </div>
    </div>
</main>
</body>
</html>
