<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="approveModal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">

  <div class="bg-white rounded-2xl p-6 w-[400px] shadow-xl">

    <h2 class="text-xl font-bold mb-2">
      Xác nhận duyệt
    </h2>

    <p class="text-gray-600 mb-6">
      Bạn có chắc chắn muốn duyệt cơ sở này không?
    </p>

    <div class="flex justify-end gap-3">

      <button type="button"
              onclick="closeApproveModal()"
              class="px-4 py-2 rounded-lg border">
        Hủy
      </button>

      <a id="confirmApproveBtn"
         href="#"
         class="px-4 py-2 rounded-lg bg-green-500 text-white">
        Duyệt
      </a>

    </div>
  </div>
</div>
</body>
</html>
