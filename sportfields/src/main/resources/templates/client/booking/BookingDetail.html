<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{client/layout/LayoutClient}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<main layout:fragment="main" class="flex-grow py-12 px-margin-mobile md:px-margin-desktop w-full max-w-container-max mx-auto mt-20">
    <header class="mb-10 text-center md:text-left">
        <h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Checkout</h1>
        <p class="font-body-md text-body-md text-secondary">Complete your booking securely.</p>
    </header>
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter">
        <!-- Left Column: Details & Services -->
        <div class="lg:col-span-7 space-y-6">
            <!-- Booking Summary Card -->
            <section class="bg-surface-container-lowest rounded-xl p-6 border border-outline-variant shadow-sm">
                <h2 class="font-headline-md text-headline-md text-on-surface mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">calendar_today</span>
                    Booking Summary
                </h2>
                <div class="flex flex-col gap-4">

                    <!-- FACILITY -->
                    <div class="flex justify-between items-start border-b border-surface-container pb-3">

                        <div>

            <span class="font-label-md text-label-md text-secondary block mb-1">
                Facility
            </span>

                            <span th:text="${details[0].schedule.court.facility.name_facility}"
                                  class="font-body-lg text-body-lg font-semibold text-on-surface">
            </span>

                        </div>

                    </div>


                    <!-- COURT -->
                    <div class="flex justify-between items-start border-b border-surface-container pb-3">

                        <div>

            <span class="font-label-md text-label-md text-secondary block mb-1">
                Court
            </span>

                            <span th:text="${details[0].schedule.court.name_court}"
                                  class="font-body-lg text-body-lg font-semibold text-on-surface">
            </span>

                        </div>

                    </div>


                    <!-- DATE -->
                    <div class="flex justify-between items-start border-b border-surface-container pb-3">

                        <div>

            <span class="font-label-md text-label-md text-secondary block mb-1">
                Date
            </span>

                            <span th:text="${details[0].schedule.date_start}"
                                  class="font-body-md text-body-md text-on-surface">
            </span>

                        </div>

                    </div>


                    <!-- TIME -->
                    <div>

        <span class="font-label-md text-label-md text-secondary block mb-2">
            Time
        </span>


                        <!-- Các khung giờ -->
                        <div class="space-y-2">

                            <div th:each="detail : ${details}"
                                 class="flex justify-between items-center
                        bg-surface-container-low
                        border border-outline-variant
                        rounded-lg
                        px-4 py-3">

                <span class="font-body-md text-on-surface">

                    <span th:text="${detail.time_start}"></span>

                    -

                    <span th:text="${detail.time_end}"></span>

                </span>

                            </div>

                        </div>

                    </div>

                </div>
            </section>
            <!-- Additional Services -->
            <section class="bg-surface-container-lowest rounded-xl p-6 border border-outline-variant shadow-sm">
                <h2 class="font-headline-md text-headline-md text-on-surface mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">add_circle</span>
                    Additional Services
                </h2>
                <div class="space-y-4">
                    <!-- Service Item -->
                    <div th:each="service : ${page.content}"
                         th:attr="
         data-id=${service.id},
         data-price=${service.price}"
                         class=" service-item flex items-center justify-between p-4 border border-surface-variant rounded-lg bg-surface-bright">
                        <div class=" flex items-center gap-4">
                            <div>
                                <h3 th:text="${service.title}" class="font-body-md text-body-md font-semibold text-on-surface"></h3>
                                <p class="font-label-md text-label-md text-primary">
                                    <span th:text="${service.price}"></span>
                                    /
                                    <span th:text="${service.unit}"></span>
                                </p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button type="button" class="btn-minus w-8 h-8 rounded-full bg-surface-container hover:bg-surface-container-high flex items-center justify-center text-on-surface transition-colors">
                                <span class="material-symbols-outlined text-sm">remove</span>
                            </button>
                            <span class=" service-quantity font-body-md text-body-md w-4 text-center">0</span>
                            <button type="button" class="btn-plus w-8 h-8 rounded-full bg-surface-container hover:bg-surface-container-high flex items-center justify-center text-on-surface transition-colors">
                                <span class="material-symbols-outlined text-sm">add</span>
                            </button>
                        </div>
                    </div>


                </div>
            </section>
        </div>
        <!-- Right Column: Payment & Summary -->
        <div class="lg:col-span-5 space-y-6">
            <!-- Order Summary -->
            <section class="bg-surface-container-lowest rounded-xl p-6 border border-outline-variant shadow-[0_4px_12px_rgba(15,23,42,0.05)] sticky top-6">
                <h2 class="font-headline-md text-headline-md text-on-surface mb-6 border-b border-surface-container pb-4">Payment Details</h2>
                <div class="space-y-4 mb-6">
                    <div class="flex justify-between items-center">
                        <span class="font-body-md text-body-md text-secondary">Court Fee (1 hour)</span>
                        <span th:text="${#numbers.formatDecimal(#aggregates.sum(details.![price]), 0, 'COMMA', 0, 'POINT')} + 'đ'" class="font-body-md text-body-md text-on-surface font-semibold"></span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-body-md text-body-md text-secondary">Services Fee</span>
                        <span id="service-fee" class="font-body-md text-body-md text-on-surface font-semibold"></span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-body-md text-body-md text-secondary">Discount</span>
                        <span class="font-body-md text-body-md text-primary font-semibold">0đ</span>
                    </div>
                </div>
                <div  class="border-t border-surface-container pt-4 mb-8 flex justify-between items-end">
                    <span class="font-headline-md text-headline-md text-on-surface">Total</span>
                    <span id="total-price" th:attr="data-court-total=${courtTotal}"
                          th:text="${#numbers.formatDecimal(courtTotal, 0, 'COMMA', 0, 'POINT')} + 'đ'" class="font-headline-lg text-headline-lg text-primary"></span>
                </div>
                <!-- Payment Methods -->
                <h3 class="font-body-lg text-body-lg font-semibold text-on-surface mb-4">Select Payment Method</h3>
                <div class="space-y-3 mb-8">
                    <label class="flex items-center p-4 border border-primary rounded-lg cursor-pointer bg-primary-fixed/20 transition-colors">
                        <input checked="" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary" name="payment" type="radio"/>
                        <span class="ml-3 font-body-md text-body-md text-on-surface flex-grow">Thẻ tín dụng/Ghi nợ</span>
                        <span class="material-symbols-outlined text-secondary">credit_card</span>
                    </label>
                    <label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-bright transition-colors">
                        <input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary" name="payment" type="radio"/>
                        <span class="ml-3 font-body-md text-body-md text-on-surface flex-grow">Ví điện tử</span>
                        <span class="material-symbols-outlined text-secondary">account_balance_wallet</span>
                    </label>
                    <label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-bright transition-colors">
                        <input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary" name="payment" type="radio"/>
                        <span class="ml-3 font-body-md text-body-md text-on-surface flex-grow">Chuyển khoản ngân hàng</span>
                        <span class="material-symbols-outlined text-secondary">account_balance</span>
                    </label>
                </div>
                <a  th:href="@{/paypal/pay}" class="w-full flex items-center justify-center bg-primary text-on-primary py-4 rounded-lg font-headline-md text-headline-md hover:bg-surface-tint transition-colors shadow-sm active:scale-[0.98]">
                    Xác nhận &amp; Thanh toán
                </a>
                <p class="text-center font-label-md text-label-md text-secondary mt-4 flex items-center justify-center gap-1">
                    <span class="material-symbols-outlined text-sm">lock</span> Secure Transaction
                </p>
            </section>
        </div>
    </div>
</main>
</body>
</html>
