<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"

      layout:decorate="~{client/layout/LayoutClient}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

<body>
<main layout:fragment="main" class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-8 mt-10">
    <!-- Breadcrumbs & Title -->
    <nav class="mb-6 flex items-center gap-2 text-sm font-medium text-secondary">
        <a class="hover:text-primary transition-colors" href="#">Trang chủ</a>
        <span class="material-symbols-outlined text-sm">chevron_right</span>
        <a class="hover:text-primary transition-colors" href="#">Tài khoản</a>
        <span class="material-symbols-outlined text-sm">chevron_right</span>
        <span class="text-primary font-semibold">Lịch sử đặt sân</span>
    </nav>
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-surface-variant pb-4">
        <h1 class="font-headline-xl text-on-surface">Lịch sử đặt sân</h1>
        <div class="flex bg-surface-container-low p-1 rounded-lg">
            <button class="px-6 py-2 text-sm transition-all active-tab" id="btn-all" onclick="filterBookings('all')">Tất cả</button>
            <button class="px-6 py-2 text-sm font-medium transition-all text-secondary hover:text-primary" id="btn-upcoming" onclick="filterBookings('upcoming')">Sắp tới</button>
            <button class="px-6 py-2 text-sm font-medium transition-all text-secondary hover:text-primary" id="btn-completed" onclick="filterBookings('completed')">Đã hoàn thành</button>
        </div>
    </div>
    <!-- Bookings Grid -->
    <div class="grid grid-cols-1 gap-6" id="bookings-container">
        <!-- Booking Card 1: Upcoming -->
        <div th:each="booking : ${bookings}"  th:with="firstDetail=${booking.bookingDetail[0]}"   class="booking-card bg-surface-container-lowest rounded-xl overflow-hidden flex flex-col md:flex-row" data-status="upcoming">
            <div class="md:w-64 h-48 md:h-auto overflow-hidden relative flex-shrink-0">
                <img th:src="${firstDetail.scheduleDetails.schedule.court.facility.img_url}" class="w-full h-full object-cover" data-alt="A high-end indoor badminton court with vibrant blue flooring and bright orange lines." />
                <div class="absolute top-4 left-4">
                    <span th:text="${
            booking.status.name() == 'PENDING'
            ? 'Chờ xác nhận'
            : booking.status.name() == 'APPROVED'
                ? 'Đã xác nhận'
                : booking.status.name() == 'CANCELLED'
                    ? 'Đã hủy'
                    : 'Đã hoàn thành'
        }"class="bg-primary text-white px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider"></span>
                </div>
            </div>
            <div class="flex-grow p-6 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-start mb-4">
                        <h3 th:text="${firstDetail.scheduleDetails.schedule.court.facility.name_facility}" class="font-headline-md text-on-surface"></h3>
                        <span  th:text="${#numbers.formatDecimal(booking.total, 0, 'COMMA', 0, 'POINT')} + 'đ'" class="font-semibold text-primary"></span>
                    </div>
                    <div class="flex flex-col gap-3 text-secondary mb-4">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-outline text-sm">calendar_today</span>

                            <span
                                    th:text="${#temporals.format(booking.booking_date, 'dd/MM/yyyy')}"
                                    class="text-sm font-medium">
    </span>
                        </div>
                        <div class="flex flex-col gap-2">
                            <div th:each="detail : ${booking.bookingDetail}" class="flex items-center gap-3">
                                <span class="material-symbols-outlined text-outline text-sm">schedule</span>
                                <span class="text-sm font-medium">

                            <span th:text="${detail.scheduleDetails.schedule.court.name_court}">
                            </span>

                            :

                            <span th:text="${detail.scheduleDetails.time_start}">
                            </span>

                            -

                            <span th:text="${detail.scheduleDetails.time_end}">
                            </span>

                        </span>
                            </span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex flex-wrap gap-3 mt-4">
                    <button class="bg-primary text-white text-sm font-semibold px-6 py-2.5 rounded-lg hover:opacity-90 transition-opacity flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">visibility</span> Xem chi tiết
                    </button>
                    <button th:if="${booking.status == T(com.hoainhi.sportfields.enums.BookingStatus).PENDING
            or booking.status == T(com.hoainhi.sportfields.enums.BookingStatus).APPROVE}"  class="border border-error text-error text-sm font-semibold px-6 py-2.5 rounded-lg hover:bg-error-container/10 transition-colors">
                        Hủy đặt sân
                    </button>
                </div>
            </div>
