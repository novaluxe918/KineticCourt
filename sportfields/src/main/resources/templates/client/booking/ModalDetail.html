<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="absolute inset-0 z-0">
  <iframe class="w-full h-full border-0 pointer-events-none opacity-50" src="{{DATA:SCREEN:SCREEN_2}}" title="Background Screen"></iframe>
</div>
<!-- Modal Overlay -->
<div th:fragment="detailHistory"
     id="detailHistoryModal" aria-modal="true" class="fixed hidden inset-0 z-50 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-on-background/40 backdrop-blur-sm transition-opacity" role="dialog">
  <!-- Modal Content Container -->
  <div class="bg-surface rounded-xl shadow-lg w-full max-w-lg flex flex-col max-h-[921px] overflow-hidden relative">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-surface-variant bg-surface sticky top-0 z-10">
      <h2 class="font-headline-md text-headline-md text-on-background">Chi tiết đặt sân</h2>
      <button id="btnCloseDetail" aria-label="Close" class="p-2 rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant">
        <span aria-hidden="true" class="material-symbols-outlined">close</span>
      </button>
    </div>
    <!-- Scrollable Body -->
    <div class="overflow-y-auto px-6 py-6 space-y-6">
      <!-- Booking Status Badge -->
      <div class="flex items-center justify-between">
        <span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Trạng thái</span>
        <span id="modalStatus" class="inline-flex items-center px-3 py-1 rounded-full text-sm font-semibold bg-primary-fixed text-primary-container">

                    </span>
      </div>
      <!-- Court Information -->
      <div class="bg-surface-container-lowest border border-surface-variant rounded-lg p-4 flex gap-4">
        <div class="w-20 h-20 rounded-md overflow-hidden shrink-0 bg-surface-container">
          <img class="w-full h-full object-cover" data-alt="A brightly lit indoor badminton court with a professional green synthetic floor, white lines clearly marked, and a net strung tautly across the middle. High-key lighting illuminates the empty space, reflecting a clean, modern aesthetic suitable for a high-performance sports facility booking app in a light mode palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUf91fZ80KGhFvhoGgbdVu-8AghL3gCeffoGURpv3vRA6UOKvjQKM46lILUNW0km7H1it65LZ_80Qoduv746Xz-i63tHyF6puPHcxIhUspqwWukWBxLclhLsBTgd1W7tUutSXod6h8ecKdXfugF4gVLGt5nEhn9zdCeKtIw1U-01_AS6Xv_x9Os_6BE9p1gTtmVP0OhI5Y_R0iqWCmEa66aZx3Q6JbAhduJXu7KAPzi6Jsqm7vtMXs"/>
        </div>
        <div class="flex flex-col justify-center">
          <h3 id="modalClubName"
              class="font-headline-md text-lg font-bold text-on-background mb-1"></h3>
          <p id="modalCourtName" class="font-body-md text-body-md text-primary-container font-semibold mb-1"></p>
          <p id="modalAddress" class="font-body-md text-sm text-on-surface-variant flex items-start gap-1">
            <span  class="material-symbols-outlined text-[16px] mt-0.5">location_on</span>

          </p>
        </div>
      </div>
      <!-- Time & Date -->
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-surface-container-low rounded-lg p-3 flex items-center gap-3">
          <div class="p-2 bg-surface rounded-full text-primary-container shadow-sm">
            <span class="material-symbols-outlined">calendar_today</span>
          </div>
          <div>
            <p  class="text-xs text-on-surface-variant font-medium uppercase tracking-wide">Ngày</p>
            <p id="modalDate" class="font-body-md text-sm font-semibold text-on-background"></p>
          </div>
        </div>
        <div class="bg-surface-container-low rounded-lg p-3 flex items-center gap-3">
          <div class="p-2 bg-surface rounded-full text-primary-container shadow-sm">
            <span class="material-symbols-outlined">schedule</span>
          </div>
          <div>
            <p class="text-xs text-on-surface-variant font-medium uppercase tracking-wide">Giờ</p>
            <p id="modalTime" class="font-body-md text-sm font-semibold text-on-background"></p>
          </div>
        </div>
      </div>
      <hr class="border-surface-variant"/>
      <!-- Additional Services -->
      <div>
        <h4 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-3">Dịch vụ đi kèm</h4>
        <ul id="modalServices" class="space-y-2">

        </ul>
      </div>
      <hr class="border-surface-variant"/>
      <!-- Payment Summary -->
      <div>
        <h4 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-3">Thanh toán</h4>
        <div class="flex justify-between items-end">
          <div>
            <p class="font-body-md text-sm text-on-background mb-1">Phương thức: <span class="font-medium">Chuyển khoản (VNPay)</span></p>
            <p class="font-body-md text-sm text-on-surface-variant">Mã GD: #KC-982347</p>
          </div>
          <div class="text-right">
            <p class="text-xs text-on-surface-variant font-medium uppercase tracking-wide mb-1">Tổng cộng</p>
            <p id="modalTotal" class="font-headline-md text-[20px] font-bold text-primary-container"></p>
          </div>
        </div>
      </div>
    </div>
    <!-- Footer Actions -->
    <div class="p-6 border-t border-surface-variant bg-surface flex justify-end gap-3 rounded-b-xl sticky bottom-0 z-10">
      <button id="btnCloseDetail2" class="px-6 py-2.5 rounded border border-outline text-secondary font-label-md text-label-md hover:bg-surface-container-low hover:text-on-background transition-colors">
        Đóng
      </button>
      <button class="px-6 py-2.5 rounded bg-primary-container text-on-primary font-label-md text-label-md hover:bg-primary transition-colors shadow-sm active:scale-95">
        Hủy đặt sân
      </button>
    </div>
  </div>
</div>
</body>
</html>
