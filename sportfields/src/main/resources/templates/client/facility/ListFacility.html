<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{client/layout/LayoutClient}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<main layout:fragment="main"  class="flex-grow w-full max-w-container-max mx-auto px-margin-desktop py-8 mt-10">
    <!-- Breadcrumbs & Header -->
    <nav class="mb-6">
        <ol class="flex items-center gap-2 text-on-surface-variant font-label-md text-label-md">
            <li><a class="hover:text-primary transition-colors" href="#">Home</a></li>
            <li><span class="material-symbols-outlined text-[16px]">chevron_right</span></li>
            <li class="text-primary font-bold">Courts</li>
        </ol>
    </nav>
    <h1 class="font-headline-xl text-headline-xl text-on-surface mb-10 tracking-tight">Danh sách sân cầu lông</h1>
    <div class="w-full">

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

            <div th:each="facility : ${facilities}"
                 class="bg-white rounded-3xl overflow-hidden group hover:shadow-2xl transition-all duration-500">

                <div class="h-72 overflow-hidden relative">
                    <img th:src="${facility.img_url}"
                         class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
                         data-alt="Badminton court" />

                    <div class="absolute top-4 left-4 bg-primary-container text-white px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                        Most Popular
                    </div>
                </div>

                <div class="p-8">

                    <h3 th:text="${facility.name_facility}"
                        class="font-headline-md text-xl mb-2">
                    </h3>

                    <div class="flex items-center gap-2 text-secondary text-sm mb-6">
                    <span class="material-symbols-outlined text-sm">
                        location_on
                    </span>

                        <span th:text="${facility.address}"></span>
                    </div>

                    <div class="flex justify-between items-center pt-6 border-t border-surface-variant/30">

                        <div class="flex items-center gap-2 text-on-surface font-medium">
                        <span class="material-symbols-outlined text-primary text-lg">
                            schedule
                        </span>

                            <span th:text="${facility.open_time}"
                                  class="text-sm"></span>

                            <span>-</span>

                            <span th:text="${facility.close_time}"
                                  class="text-sm"></span>
                        </div>

                        <a th:href="@{/facility/view/{id}(id=${facility.id})}"
                           class="bg-on-background text-white px-6 py-2.5 rounded-lg font-bold text-sm hover:bg-primary-container transition-colors">
                            Book Now
                        </a>

                    </div>
                </div>

            </div>

        </div>

        <!-- Pagination -->
        <div class="mt-16 flex justify-center">
            <nav class="flex items-center gap-2">

                <button class="w-10 h-10 rounded-lg border border-outline-variant flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors">
                <span class="material-symbols-outlined">
                    chevron_left
                </span>
                </button>

                <button class="w-10 h-10 rounded-lg bg-primary-container text-on-primary font-bold shadow-sm">
                    1
                </button>

                <button class="w-10 h-10 rounded-lg border border-outline-variant flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors font-medium">
                    2
                </button>

                <button class="w-10 h-10 rounded-lg border border-outline-variant flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors font-medium">
                    3
                </button>

                <span class="px-2 text-on-surface-variant">...</span>

                <button class="w-10 h-10 rounded-lg border border-outline-variant flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors font-medium">
                    8
                </button>

                <button class="w-10 h-10 rounded-lg border border-outline-variant flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors">
                <span class="material-symbols-outlined">
                    chevron_right
                </span>
                </button>

            </nav>
        </div>

    </div>
</main>
</body>
</html>
